# ── AIRcoin Unified Production Reverse Proxy ──

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream validator_api {
    server validator:3001;
}

upstream indexer_api {
    server indexer:3002;
}

upstream miner_api {
    server miner:8090;
}

upstream mqtt_ws {
    server mqtt:9001;
}

server {
    listen 80;
    server_name _;

    # Global CORS headers for Vercel frontends
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;

    # ACME Challenge for Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check for AWS Application Load Balancer
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # Root route: Proxy to Miner Health Dashboard
    location = / {
        proxy_pass http://miner_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Validator C3 Attestation Oracle
    location /v1/attestations {
        proxy_pass http://validator_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/accepted {
        proxy_pass http://validator_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v1/rejections {
        proxy_pass http://validator_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Indexer C4 REST and WebSocket
    location /v1/ {
        proxy_pass http://indexer_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/events {
        proxy_pass http://indexer_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # 5. Miner Daemon / Scenario Controller / Health
    location /api/ {
        proxy_pass http://miner_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://miner_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 6. MQTT over WebSockets for browser twins
    location /mqtt {
        proxy_pass http://mqtt_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
